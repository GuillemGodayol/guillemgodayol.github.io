profile:
  meta_title:
    ca: "CV de copilot de rally raid"
    es: "CV de copiloto de rally raid"
    en: "Rally raid codriver CV"
  meta_description:
    ca: "Curriculum viu d'un copilot orientat als rally raids de llarga distancia."
    es: "Curriculum vivo de un copiloto orientado a rally raids de larga distancia."
    en: "Live CV for a codriver focused on long-distance rally raid."
  name: "Guillem Godayol"
  headline:
    ca: "Copilot de rally raid, tant per velocitat com per regularitat."
    es: "Copiloto de rally raid, tanto para velocidad como para regularidad."
    en: "Rally raid codriver, for both speed and regularity races."
  bio:
    ca: "Aficionat des de petit als ral·lis, especialment als raids de llarga distància. Amb experiència en diverses competicions i formacions, busco seguir creixent com a copilot i afrontar nous reptes al món del rally raid."
    es: "Aficionado desde pequeño a los rallies, especialmente a los raids de larga distancia. Con experiencia en diversas competiciones y formaciones, busco seguir creciendo como copiloto y afronar nuevos retos en el mundo del rally raid."
    en: "I’ve been a fan of rallying since I was a child, particularly long-distance rallies. With experience in various competitions and training programmes, I’m keen to continue developing as a co-driver and take on new challenges in the world of rally raids."
  location:
    ca: "Barcelona"
    es: "Barcelona"
    en: "Barcelona"
  contact:
    instagram_cta:
      ca: "Contacta'm per Instagram"
      es: "Contacta conmigo por Instagram"
      en: "Contact me through Instagram"
    instagram: "@guillemgodayol"
  photo:
    src: "/images/profile_picture.png"
    alt:
      ca: "Foto de perfil"
      es: "Foto de perfil"
      en: "Profile photo"

